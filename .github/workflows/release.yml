name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta que quieres publicar, por ejemplo v0.1.5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Set package version from tag
        shell: pwsh
        run: |
          $releaseTag = "${{ inputs.tag || github.ref_name }}"
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "La etiqueta '$releaseTag' debe tener el formato vX.Y.Z."
          }

          $version = $releaseTag.Substring(1)
          $currentVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($currentVersion -eq $version) {
            Write-Host "package.json ya usa la versión $version."
          } else {
            npm version $version --no-git-tag-version --ignore-scripts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: SolutionsPDF ${{ inputs.tag || github.ref_name }}
          releaseBody: Actualización de SolutionsPDF.
          releaseDraft: false
          prerelease: false